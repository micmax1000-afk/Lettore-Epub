<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPUB Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>📖 EPUB Reader</h1>
            <label for="file-input" class="btn">Carica EPUB</label>
            <input type="file" id="file-input" accept=".epub">
        </header>

        <div id="controls">
            <button id="prev" disabled>◀ Precedente</button>
            <span id="progress">0%</span>
            <button id="next" disabled>Successiva ▶</button>
        </div>

        <!-- Messaggio di stato -->
        <div id="status">Seleziona un file EPUB per iniziare</div>

        <!-- Area di lettura -->
        <div id="viewer"></div>

        <!-- Indice (TOC) -->
        <div id="toc-panel">
            <h3>📑 Indice</h3>
            <ul id="toc-list">
                <li style="color:#888; font-style:italic;">Carica un EPUB per vedere l'indice</li>
            </ul>
        </div>
    </div>

    <!-- EPUB.js da CDN -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
