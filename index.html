<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettore EPUB leggero</title>
  <style>
    body { margin:0; display:flex; flex-direction:column; height:100vh; font-family:sans-serif; }
    #toolbar { padding:10px; background:#2c3e50; color:white; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #toolbar button { background:#3498db; border:none; color:white; padding:6px 14px; border-radius:20px; cursor:pointer; }
    #toolbar button:disabled { opacity:0.4; }
    #viewer { flex:1; overflow:auto; background:#fafaf8; padding:20px; }
    #status { padding:6px 12px; background:#ecf0f1; font-size:0.9rem; border-bottom:1px solid #ccc; min-height:30px; }
    .error { background:#fadbd8; color:#c0392b; }
    .ok { background:#d5f5e3; color:#27ae60; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span style="flex:1;">📖 EPUB Reader</span>
    <button id="openBtn">📂 Carica EPUB</button>
    <input type="file" id="fileInput" accept=".epub" style="display:none;">
    <button id="prevBtn" disabled>◀</button>
    <span id="progress">0%</span>
    <button id="nextBtn" disabled>▶</button>
  </div>
  <div id="status">📂 Carica un file EPUB</div>
  <div id="viewer"></div>

  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script>
    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const openBtn = document.getElementById('openBtn');
    const fileInput = document.getElementById('fileInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressSpan = document.getElementById('progress');

    let book, rendition;

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = type || '';
    }

    openBtn.onclick = () => fileInput.click();

    fileInput.onchange = function(e) {
      const file = this.files[0];
      if (!file) return;
      if (!file.name.endsWith('.epub')) {
        setStatus('❌ Il file deve essere .epub', 'error');
        return;
      }
      setStatus('⏳ Lettura file...', '');
      const reader = new FileReader();
      reader.onload = (ev) => {
        const buf = ev.target.result;
        const blob = new Blob([buf], { type: 'application/epub+zip' });
        const url = URL.createObjectURL(blob);
        openBook(url);
      };
      reader.readAsArrayBuffer(file);
      this.value = '';
    };

    function openBook(url) {
      setStatus('⏳ Caricamento EPUB...', '');
      if (book) { try { book.destroy(); } catch(e) {} }
      if (rendition) { try { rendition.destroy(); } catch(e) {} }

      book = ePub(url, {
        // Carica solo i metadati, non tutto il contenuto
        openAs: 'epub',
        requests: { concurrent: 1 } // una richiesta alla volta
      });

      rendition = book.renderTo('viewer', {
        width: '100%',
        height: '100%',
        spread: 'none',
        flow: 'paginated'
      });

      rendition.display()
        .then(() => {
          setStatus('✅ Pronto', 'ok');
          prevBtn.disabled = false;
          nextBtn.disabled = false;
          updateProgress();
        })
        .catch(err => {
          setStatus('❌ Errore: ' + err.message, 'error');
          console.error(err);
        });

      rendition.on('rendered', updateProgress);
      rendition.on('locationChanged', updateProgress);

      prevBtn.onclick = () => rendition.prev();
      nextBtn.onclick = () => rendition.next();

      // Tasti freccia
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); rendition.next(); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); rendition.prev(); }
      });
    }

    function updateProgress() {
      try {
        const loc = rendition.currentLocation();
        if (loc && loc.start) {
          const pct = Math.round(loc.start.percentage * 100);
          progressSpan.textContent = pct + '%';
        }
      } catch(e) {}
    }
  </script>
</body>
</html>
