<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Lettore EPUB gratuito e open source. Carica e leggi i tuoi ebook direttamente nel browser." />
  <meta name="theme-color" content="#1a1a2e" />
  <title>EPUB Reader – Lettore di ebook online</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <!-- Schermata iniziale -->
  <div id="welcome" class="welcome">
    <div class="welcome-content">
      <div class="logo">📖</div>
      <h1>EPUB Reader</h1>
      <p>Carica un file <strong>.epub</strong> per iniziare a leggere</p>
      <label class="btn btn-primary" for="file-input">
        Apri ebook
        <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden />
      </label>
      <p class="hint">Oppure trascina il file qui</p>
      <p class="footer-note">Funziona interamente nel browser · Nessun server · Privacy totale</p>
    </div>
  </div>

  <!-- Interfaccia di lettura -->
  <div id="reader" class="reader hidden">
    <!-- Barra superiore -->
    <header class="toolbar">
      <button id="btn-toc" class="btn-icon" title="Sommario" aria-label="Sommario">☰</button>
      <div class="book-info">
        <span id="book-title">Titolo</span>
        <span id="book-author" class="author"></span>
      </div>
      <div class="controls">
        <button id="btn-font-dec" class="btn-icon" title="Riduci testo" aria-label="Riduci testo">A−</button>
        <button id="btn-font-inc" class="btn-icon" title="Ingrandisci testo" aria-label="Ingrandisci testo">A+</button>
        <button id="btn-theme" class="btn-icon" title="Cambia tema" aria-label="Cambia tema">◐</button>
        <button id="btn-open" class="btn-icon" title="Apri altro ebook" aria-label="Apri altro ebook">📂</button>
      </div>
    </header>

    <!-- Contenuto principale -->
    <div class="main">
      <!-- Sidebar TOC -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2>Sommario</h2>
          <button id="btn-close-toc" class="btn-icon" aria-label="Chiudi">✕</button>
        </div>
        <nav id="toc" class="toc"></nav>
      </aside>

      <!-- Area di lettura -->
      <div class="viewer-wrapper">
        <div id="viewer"></div>
        <div class="nav-overlay">
          <button id="btn-prev" class="nav-btn prev" title="Pagina precedente" aria-label="Precedente">‹</button>
          <button id="btn-next" class="nav-btn next" title="Pagina successiva" aria-label="Successiva">›</button>
        </div>
      </div>
    </div>

    <!-- Barra inferiore -->
    <footer class="status-bar">
      <button id="btn-prev-mobile" class="btn-nav-mobile" aria-label="Precedente">‹ Prec</button>
      <span id="location-info">—</span>
      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
      <button id="btn-next-mobile" class="btn-nav-mobile" aria-label="Successiva">Succ ›</button>
    </footer>
  </div>

  <!-- Overlay di caricamento -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <p>Caricamento ebook…</p>
  </div>

  <!-- Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
